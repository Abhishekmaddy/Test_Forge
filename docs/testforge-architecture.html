<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TestForge architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--surface-1:#f5f4f0;--text-primary:#1f1e1c;--text-secondary:#5f5e5a;--text-muted:#9a988f;
  --border:#e3e1da;--border-strong:#c9c7bf;--border-stronger:#8a8880;
  --purple-f:#EEEDFE;--purple-s:#534AB7;--purple-t:#3C3489;
  --blue-f:#E6F1FB;--blue-s:#185FA5;--blue-t:#0C447C;
  --amber-f:#FAEEDA;--amber-s:#854F0B;--amber-t:#633806;
  --teal-f:#E1F5EE;--teal-s:#0F6E56;--teal-t:#085041;
  --pink-f:#FBEAF0;--pink-s:#993556;--pink-t:#72243E;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1c1b19;--surface-1:#262522;--text-primary:#ecebe6;--text-secondary:#b4b2a9;--text-muted:#7a786f;
  --border:#34332f;--border-strong:#4a4944;--border-stronger:#8a8880;
  --purple-f:#3C3489;--purple-s:#AFA9EC;--purple-t:#EEEDFE;
  --blue-f:#0C447C;--blue-s:#85B7EB;--blue-t:#E6F1FB;
  --amber-f:#633806;--amber-s:#EF9F27;--amber-t:#FAEEDA;
  --teal-f:#085041;--teal-s:#5DCAA5;--teal-t:#E1F5EE;
  --pink-f:#72243E;--pink-s:#ED93B1;--pink-t:#FBEAF0;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text-primary);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
main{max-width:920px;margin:0 auto;padding:32px 20px 48px}
h1{font-size:22px;font-weight:500;margin:0 0 4px}
.sub{font-size:14px;color:var(--text-secondary);margin:0 0 20px}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
button{font:inherit;font-size:13px;color:var(--text-primary);background:transparent;border:0.5px solid var(--border-strong);border-radius:8px;padding:6px 12px;cursor:pointer;transition:background .15s}
button:hover{background:var(--surface-1)}
button:focus-visible{outline:2px solid #378ADD;outline-offset:2px}
button.active{background:var(--surface-1);border-color:var(--border-stronger)}
#cap{font-size:13px;color:var(--text-secondary);min-height:20px;margin:0 0 8px}
svg{display:block;width:100%;height:auto}
svg text{font-family:inherit}
.t{font-size:14px;font-weight:400}
.th{font-size:14px;font-weight:500}
.node{cursor:pointer}
.node:hover rect{opacity:.85}
.c-purple>rect{fill:var(--purple-f);stroke:var(--purple-s)}.c-purple>text{fill:var(--purple-t)}
.c-blue>rect{fill:var(--blue-f);stroke:var(--blue-s)}.c-blue>text{fill:var(--blue-t)}
.c-amber>rect{fill:var(--amber-f);stroke:var(--amber-s)}.c-amber>text{fill:var(--amber-t)}
.c-teal>rect{fill:var(--teal-f);stroke:var(--teal-s)}.c-teal>text{fill:var(--teal-t)}
.c-pink>rect{fill:var(--pink-f);stroke:var(--pink-s)}.c-pink>text{fill:var(--pink-t)}
.grp{fill:none;stroke:var(--border-strong);stroke-width:0.5;stroke-dasharray:4 4}
.edge{fill:none;stroke:var(--text-muted);stroke-width:1.2;transition:opacity .35s,stroke .35s}
.edge.on{stroke-dasharray:6 5}
.edge.dash{stroke-dasharray:3 4}
@media (prefers-reduced-motion:no-preference){.edge.on{animation:dash .9s linear infinite}}
@keyframes dash{to{stroke-dashoffset:-11}}
g.n{transition:opacity .35s}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:12px 0 0}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary)}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.hint{font-size:12px;color:var(--text-muted);margin:14px 0 0}
</style>
</head>
<body>

<p class="sub">Playwright + TypeScript + Cucumber BDD, with an MCP server for AI-driven test generation.</p>

</div>

<script>
const REPO='https://github.com/abhishekmaddy/test_forge/';
const BR='abhishekAutomation/';
document.querySelectorAll('[data-url]').forEach(g=>{
  const u=g.dataset.url;
  const href=u.startsWith('tree:')?REPO+'tree/'+BR+u.slice(5):REPO+'blob/'+BR+u;
  g.setAttribute('tabindex','0');g.setAttribute('role','link');
  g.addEventListener('click',()=>window.open(href,'_blank','noopener'));
  g.addEventListener('keydown',e=>{if(e.key==='Enter')window.open(href,'_blank','noopener');});
});
const F={
all:{c:null,t:'Every connection in the framework, running at once.'},
ui:{c:'#378ADD',t:'UI run: scenario matches login and Flipkart steps, page objects drive the browser, config supplies settings.'},
api:{c:'#1D9E75',t:'API run: scenario matches API steps, which call the API helper to hit the application API.'},
report:{c:'#D85A30',t:'Reporting: hooks record results in Allure and post them to JIRA through the JIRA client.'},
ai:{c:'#D4537E',t:'AI generation: MCP server dispatches test generation, which fetches the story, builds prompts, and writes files.'},
analysis:{c:'#7F77DD',t:'Failure analysis: the AI assistant asks the MCP server to run its analysis tools.'}};
const order=['ui','api','report','ai','analysis'];
const edges=[...document.querySelectorAll('.edge')];
const nodes=[...document.querySelectorAll('g.n')];
const pk=document.getElementById('pk');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let packets=[],timer=null,idx=0;
function colorFor(e){const k=e.dataset.f.split(' ').find(x=>F[x]);return k?F[k].c:'#888780';}
function pick(f,fromTour){
  if(!fromTour&&timer)togglePlay();
  document.querySelectorAll('.fb').forEach(b=>b.classList.toggle('active',b.dataset.f===f));
  document.getElementById('cap').textContent=F[f].t;
  const live=new Set();packets=[];pk.innerHTML='';
  edges.forEach(e=>{
    const on=f==='all'||e.dataset.f.split(' ').includes(f);
    const col=f==='all'?colorFor(e):F[f].c;
    e.style.opacity=on?1:0.12;
    e.style.stroke=on?col:'';
    e.classList.toggle('on',on&&!e.classList.contains('dash'));
    if(on){
      live.add(e.dataset.a);live.add(e.dataset.b);
      if(!reduce){
        const L=e.getTotalLength();const n=f==='all'?1:(L>150?2:1);
        for(let i=0;i<n;i++){
          const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
          c.setAttribute('r','3.5');c.setAttribute('fill',col);pk.appendChild(c);
          packets.push({e,L,c,o:(i/n)*L+Math.random()*20});
        }
      }
    }
  });
  nodes.forEach(n=>{n.style.opacity=(f==='all'||live.has(n.dataset.id))?1:0.25;});
}
function tick(t){
  const s=t/1000*90;
  packets.forEach(p=>{const d=(s+p.o)%p.L;const pt=p.e.getPointAtLength(d);
    p.c.setAttribute('cx',pt.x);p.c.setAttribute('cy',pt.y);p.c.setAttribute('opacity',d>p.L-8?0:1);});
  requestAnimationFrame(tick);
}
function togglePlay(){
  const b=document.getElementById('play');
  if(timer){clearInterval(timer);timer=null;b.innerHTML='&#9654; Tour';b.setAttribute('aria-label','Play tour');return;}
  b.innerHTML='&#10074;&#10074; Pause';b.setAttribute('aria-label','Pause tour');
  idx=0;pick(order[idx],true);
  timer=setInterval(()=>{idx=(idx+1)%order.length;pick(order[idx],true);},4000);
}
pick('all');requestAnimationFrame(tick);
</script>
